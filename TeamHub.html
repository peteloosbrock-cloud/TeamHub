function renderSettings(){$('app').innerHTML='<section class="card"><h2>Team settings</h2>'+(editing?'<form id="settingsForm"><label for="teamName">Team name</label><input id="teamName" required maxlength="80" value="'+esc(team.teamName)+'"><label for="season">Season</label><input id="season" required maxlength="30" value="'+esc(team.season)+'"><label for="regulationMinutes">Regulation game length (minutes for GAA)</label><input id="regulationMinutes" type="number" min="1" max="240" step="0.5" required value="'+(team.regulationMinutes||45)+'"><p class="muted">Use your league’s full regulation game length. The default is 45 minutes.</p><p id="settingsError" class="status" role="alert"></p><button class="primary">Save settings</button></form>':'<p>'+esc(team.teamName)+' · '+esc(team.season)+'</p>')+'</section><section class="card"><h2>Keep a backup</h2><p class="muted">'+(cloud?'Your roster and results are shared through Firebase. Only the configured organizer can edit. Export a backup periodically.':'This base app stores data in this browser. Export a backup before changing devices or clearing browser data. Player view is a visual preview, not an account permission system.')+'</p><div class="toolbar"><button id="exportBackup">Export backup</button>'+(!cloud&&(editing||storageError)?'<button id="importBackup">Restore backup</button><input type="file" id="backupFile" accept="application/json,.json" hidden>':'')+'</div><p id="backupError" class="status" role="alert"></p></section><section class="card"><h2>Built for your team</h2><p class="muted">Your AVBHA / Eastview logo is included in the app and its Home Screen icon. Calendar connections, individual player profiles, and development resources can be added in later versions.</p><p class="muted">To add to an iPhone Home Screen once hosted: open in Safari, tap Share, then Add to Home Screen.</p></section>';if($('settingsForm'))$('settingsForm').onsubmit=async e=>{e.preventDefault();try{await save({type:'settings',teamNam $('toggleMode').onclick=()=>{if(storageError)return toast('Restore a valid backup first.');editing=!editing;render()};

async function loginDialog(){dialog('Organizer sign in','<form id="loginForm"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><p class="status" id="loginError" role="alert"></p><div class="actions"><button type="button" id="resetPassword">Reset password</button><button class="primary">Sign in</button></div></form>');$('loginForm').onsubmit=async e=>{e.preventDefault();e.submitter.disabled=true;try{await api.signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);$('dialog').close()}catch{$('loginError').textContent='Could not sign in. Check your email, password, and connection.';e.submitter.disabled=false}};$('resetPassword').onclick=async()=>{if(!$('email').value.trim())return $('loginError').textContent='Enter your email first.';try{await api.sendPasswordResetEmail(auth,$('email').value.trim());$('loginError').textContent='If the account exists, a reset email will be sent.'}catch{$('loginError').textContent='Could not send the reset email. Try again.'}}}
function goalieTotals(s){return s.players.filter(p=>p.position==='Goalie'||s.games.some(g=>(g.goalieEntries||[]).some(e=>e.player===p.id&&e.played))).map(p=>{const es=s.games.flatMap(g=>(g.goalieEntries||[]).filter(e=>e.player===p.id&&e.played)),mins=es.reduce((n,e)=>n+e.minutes,0),ga=es.reduce((n,e)=>n+e.goalsAgainst,0);return {...p,gp:es.length,w:es.filter(e=>e.decision==='W').length,l:es.filter(e=>e.decision==='L').length,ga,minutes:mins,gaa:mins?ga*(s.regulationMinutes||45)/mins:null}}).sort((a,b)=>b.gp-a.gp||a.name.localeCompare(b.name))}
function goalieTable(){const ps=goalieTotals(team);return ps.length?'<div class="tablewrap"><table><thead><tr><th>Goalie</th><th>#</th><th>GP</th><th>W</th><th>L</th><th>GAA</th></tr></thead><tbody>'+ps.map(p=>'<tr><td>'+esc(p.name)+(p.active?'':' (inactive)')+'</td><td>'+esc(p.number||'—')+'</td><td>'+p.gp+'</td><td>'+p.w+'</td><td>'+p.l+'</td><td>'+ (p.gaa===null?'—':p.gaa.toFixed(2))+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">Add a goalie to your roster to start tracking stats.</div>'}
function exportGoalies(){const q=x=>'"'+String(x).replace(/"/g,'""')+'"';download('teamhub-goalies.csv',[['Goalie','Jersey','GP','Wins','Losses','GAA','Goals against','Minutes'].map(q).join(',')].concat(goalieTotals(team).map(p=>[/^[=+@\-\t\r]/.test(p.name)?"'"+p.name:p.name,p.number,p.gp,p.w,p.l,p.gaa===null?'':p.gaa.toFixed(2),p.ga,p.minutes].map(q).join(','))).join('\r\n'),'text/csv;charset=utf-8')}
function goalieEditor(es){return '<h3 class="spaced">Goalie stats</h3><p class="muted">Check Played, enter actual minutes and goals allowed. Assign the W/L/T to one goalie; use No decision for the other goalie in a split game. Leave goalies unchecked when their stats are unknown. GAA uses the regulation length in Settings.</p>'+(es.length?'<div class="tablewrap"><table><thead><tr><th>Goalie</th><th>Played</th><th>Minutes</th><th>GA</th><th>Decision</th></tr></thead><tbody>'+es.map((e,i)=>{const p=team.players.find(p=>p.id===e.player);return '<tr class="statrow"><td>'+esc(p?.name||'Unknown goalie')+'</td><td><input type="checkbox" data-goalie-played="'+i+'" aria-label="'+esc(p?.name)+' played"'+(e.played?' checked':'')+'></td><td><input class="gameinput" data-goalie-minutes="'+i+'" type="number" min="0" max="240" step="0.5" required aria-label="Goalie minutes" value="'+e.minutes+'"></td><td><input class="gameinput" data-goalie-ga="'+i+'" type="number" min="0" max="10000" step="1" required aria-label="Goals allowed" value="'+e.goalsAgainst+'"></td><td><select data-goalie-decision="'+i+'" aria-label="Goalie decision">'+[['ND','No decision'],['W','Win'],['L','Loss'],['T','Tie']].map(([v,t])=>'<option value="'+v+'"'+(e.decision===v?' selected':'')+'>'+t+'</option>').join('')+'</select></td></tr>'}).join('')+'</tbody></table></div>':'<p class="muted">Add goalies in Roster first.</p>')}
function readGoalieEditor(es){const out=es.map((e,i)=>{const played=document.querySelector('[data-goalie-played="'+i+'"]').checked;const m=document.querySelector('[data-goalie-minutes="'+i+'"]').value,ga=document.querySelector('[data-goalie-ga="'+i+'"]').value;if(m===''||!Number.isFinite(Number(m))||Number(m)<0||Number(m)>240||!whole(ga))throw Error('Check goalie minutes and goals allowed.');return {...e,played,minutes:Number(m),goalsAgainst:Number(ga),decision:document.querySelector('[data-goalie-decision="'+i+'"]').value}});if(out.some(e=>e.played?e.minutes<=0:e.minutes!==0||e.goalsAgainst!==0||e.decision!=='ND'))throw Error('Played goalies need minutes greater than zero. Unchecked goalies must have zero minutes, zero GA, and No decision.');const result=Number($('ourScore').value)>Number($('theirScore').value)?'W':Number($('ourScore').value)<Number($('theirScore').value)?'L':'T';if(out.some(e=>e.decision!=='ND'&&e.decision!==result)||out.filter(e=>e.decision!=='ND').length>1)throw Error('Assign at most one goalie decision, matching the final result.');if(out.reduce((n,e)=>n+e.goalsAgainst,0)>Number($('theirScore').value))throw Error('Goalie goals allowed cannot exceed the opponent’s score.');return out}

let planFolder='practice';
function planUrl(value){try{const u=new URL(value);return ['http:','https:'].includes(u.protocol)&&!u.username&&!u.password?u.href:null}catch{return null}}
function validPlan(p){if(!p||typeof p.id!=='string'||!['practice','game'].includes(p.folder)||typeof p.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(p.date)||typeof p.url!=='string'||p.url.length>2000||!planUrl(p.url))return false;const d=new Date(p.date+'T12:00:00Z');return Number.isFinite(d.getTime())&&d.toISOString().slice(0,10)===p.date}
function planLabel(p){const [y,m,d]=p.date.split('-');return m+'/'+d+'/'+y+(p.folder==='practice'?' Practice Plan':' Game Day')}
function renderPlans(){const plans=(team.plans||[]).filter(p=>p.folder===planFolder).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));$('app').innerHTML='<section class="card"><div class="row wrap"><h2>Practice & game plans</h2>'+(editing?'<button class="primary" id="addPlan">Post a plan</button>':'')+'</div><p class="muted">Open your team’s plans by date. Newest dates appear first.</p><div class="toolbar" role="group" aria-label="Plan folders">'+[['practice','📁 Practice'],['game','📁 Game']].map(([v,t])=>'<button data-plan-folder="'+v+'" aria-pressed="'+(planFolder===v)+'" class="'+(planFolder===v?'primary':'')+'">'+t+' ('+(team.plans||[]).filter(p=>p.folder===v).length+')</button>').join('')+'</div><div class="spaced">'+(plans.length?plans.map(p=>'<article class="game"><div class="row wrap"><a href="'+esc(planUrl(p.url))+'" target="_blank" rel="noopener noreferrer" style="font-weight:750;color:var(--green);padding:10px 0">'+esc(planLabel(p))+' ↗</a>'+(editing?'<button class="smallbtn" data-edit-plan="'+esc(p.id)+'">Edit</button>':'')+'</div></article>').join(''):'<div class="empty">No '+(planFolder==='practice'?'practice':'game')+' plans posted yet.</div>')+'</div></section>';document.querySelectorAll('[data-plan-folder]').forEach(b=>b.onclick=()=>{planFolder=b.dataset.planFolder;renderPlans()});if($('addPlan'))$('addPlan').onclick=()=>planDialog();document.querySelectorAll('[data-edit-plan]').forEach(b=>b.onclick=()=>planDialog(b.dataset.editPlan))}
function planDialog(planId){if(!editing)return;const old=(team.plans||[]).find(p=>p.id===planId),original=old?JSON.stringify(old):null,p=old||{id:id(),folder:planFolder,date:today(),url:''};$('dialogContent').innerHTML='<div class="dialoginner"><div class="dialoghead"><h2>'+(old?'Edit plan':'Post a plan')+'</h2><button type="button" id="closePlan" aria-label="Close">✕</button></div><form id="planForm"><label for="planKind">Folder</label><select id="planKind"><option value="practice">Practice</option><option value="game">Game</option></select><label for="planDate">Plan date</label><input id="planDate" type="date" required value="'+esc(p.date)+'"><label for="planLink">Plan link</label><input id="planLink" type="url" required maxlength="2000" placeholder="https://www.icehockeysystems.com/share/practice/…" value="'+esc(p.url)+'"><p class="muted" id="planPreview"></p><p class="status" id="planError" role="alert"></p><div class="actions">'+(old?'<button type="button" class="danger" id="deletePlan">Delete plan</button>':'')+'<button class="primary" id="savePlan">Save plan</button></div></form></div>';$('planKind').value=p.folder;const preview=()=>$('planPreview').textContent=$('planDate').value?'Listed as: '+planLabel({date:$('planDate').value,folder:$('planKind').value}):'Choose a date.';preview();$('planDate').oninput=preview;$('planKind').onchange=preview;$('closePlan').onclick=()=>$('dialog').close();$('dialog').showModal();$('planForm').onsubmit=async e=>{e.preventDefault();const next={id:p.id,folder:$('planKind').value,date:$('planDate').value,url:planUrl($('planLink').value.trim())};if(!validPlan(next))return $('planError').textContent='Enter a valid date and an http or https link.';$('savePlan').disabled=true;try{await save({type:'plan',plan:next,original});planFolder=next.folder;$('dialog').close();render();toast('Plan saved')}catch(e){$('planError').textContent=e.message+' If access was denied, publish the updated TeamHub Firebase rules.';$('savePlan').disabled=false}};if($('deletePlan'))$('deletePlan').onclick=async()=>{if(!confirm('Delete this plan link for everyone?'))return;$('deletePlan').disabled=true;try{await save({type:'deletePlan',id:p.id,original});$('dialog').close();toast('Plan deleted')}catch(e){$('planError').textContent=e.message;$('deletePlan').disabled=false}}}

function renderJoin(){document.querySelectorAll('[data-view]').forEach(b=>b.disabled=true);$('connection').innerHTML='';$('app').innerHTML='<section class="card"><h2>Join your team</h2><p class="muted">Enter the team invite code from your organizer. Team chat is visible to the organizer, who can delete inappropriate messages.</p><form id="joinForm"><label for="joinName">Your display name</label><input id="joinName" required maxlength="40" autocomplete="nickname" placeholder="First name and last initial"><label for="joinCode">Team invite code</label><input id="joinCode" required maxlength="12" autocapitalize="characters" autocomplete="off" spellcheck="false" value="'+esc(new URL(location.href).searchParams.get('invite')||'')+'"><p id="joinError" class="status" role="alert"></p><button class="primary"'+(!auth?.currentUser?' disabled':'')+'>Join team</button></form><p class="muted spaced">Your membership stays on this browser. On a new device or after clearing browser data, join again with the code. Display names are self-entered; they are not verified identities.</p></section>';$('joinForm').onsubmit=async e=>{e.preventDefault();const name=$('joinName').value.trim(),code=$('joinCode').value.toUpperCase().replace(/[\s-]/g,'');if(!name||name.length>40||!/^[A-Z0-9]{12}$/.test(code))return $('joinError').textContent='Enter your name and the 12-character invite code.';e.submitter.disabled=true;try{await api.setDoc(api.doc(db,'bantamhub','team','members',auth.currentUser.uid),{name,inviteCode:code,joinedAt:api.serverTimestamp()});const url=new URL(location.href);url.searchParams.delete('invite');history.replaceState(null,'',url);toast('You joined the team')}catch{$('joinError').textContent='Could not join. Check the invite code, connection, and whether the organizer has published the updated Firebase rules.';e.submitter.disabled=false}}}
function renderInvite(){const section=document.createElement('section');section.className='card';section.innerHTML='<h2>Team invite code</h2>'+(cloud&&editing?'<p class="muted">Share this code with players and parents. It grants viewing and chat access; team edits and chat moderation stay with the organizer.</p><p id="codeDisplay" style="font-size:24px;font-weight:800;letter-spacing:2px;overflow-wrap:anywhere">'+esc(inviteCode||'No code created yet')+'</p><div class="toolbar"><button class="primary" id="createCode">'+(inviteCode?'Replace invite code':'Create invite code')+'</button>'+(inviteCode?'<button id="shareCode">Share invitation</button>':'')+'</div><p class="muted spaced">Replacing the code prevents new joins with the old code. Existing members keep access.</p><p class="status" id="inviteError" role="alert">'+esc(accessError)+'</p>':'<p class="muted">'+(cloud?'Ask your organizer for the invite code.':'Invite codes and shared chat become available when connected to Firebase.')+'</p>');$('app').appendChild(section);if($('createCode'))$('createCode').onclick=rotateCode;if($('shareCode'))$('shareCode').onclick=async()=>{const url=new URL(location.href);url.search='';url.hash='';url.searchParams.set('invite',inviteCode);const text='Join '+team.teamName+' on TeamHub. Invite code: '+inviteCode+'. Chat is visible to the organizer.';try{if(navigator.share)await navigator.share({title:'TeamHub invitation',text,url:url.href});else{await navigator.clipboard.writeText(text+' '+url.href);toast('Invitation copied')}}catch(e){if(e.name!=='AbortError')toast('Copy the invite code shown in Settings to share it.')}}}
async function rotateCode(){if(!editing||!auth?.currentUser)return;if(inviteCode&&!confirm('Replace the code? Existing members keep access; the old code will stop accepting new members.'))return;const b=$('createCode');b.disabled=true;try{const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',bytes=new Uint8Array(12);crypto.getRandomValues(bytes);const code=Array.from(bytes,x=>chars[x%chars.length]).join('');await api.runTransaction(db,async tx=>{const configRef=api.doc(db,'bantamhub','team','settings','access'),current=await tx.get(configRef);const old=current.exists()?current.data().code:null;if(old)tx.delete(api.doc(db,'bantamhub','team','invites',old));tx.set(api.doc(db,'bantamhub','team','invites',code),{active:true,createdAt:api.serverTimestamp()});tx.set(configRef,{code})});toast('Invite code ready')}catch{$('inviteError').textContent='Could not save the code. Publish the updated TeamHub Firestore rules and try again.';b.disabled=false}}
function renderChat(){const draft=$('chatText')?.value||'';if(!cloud){$('app').innerHTML='<section class="card"><h2>Team chat</h2><p>Connect Firebase to use shared team chat.</p></section>';return;}$('app').innerHTML='<section class="card"><h2>Team chat</h2><p class="muted">Be respectful. The organizer can read every message and delete inappropriate comments. Only joined team members can participate.</p><p class="status" role="status" id="chatStatus">'+esc(chatError||(!chatLoaded?'Loading chat…':''))+'</p><div class="chatMessages" id="chatMessages"></div><form id="chatForm"><label for="chatText">Message</label><textarea id="chatText" rows="3" required maxlength="1000" placeholder="Write to your team…"></textarea><div class="actions"><button class="primary" id="sendChat"'+(chatSending||!chatLoaded||chatError?' disabled':'')+'>Send message</button></div></form><p class="muted spaced">Showing the latest 100 messages.</p></section>';$('chatText').value=draft;paintMessages();$('chatForm').onsubmit=async e=>{e.preventDefault();if(chatSending)return;const body=$('chatText').value.trim();if(!body)return toast('Write a message first.');chatSending=true;$('sendChat').disabled=true;try{await api.addDoc(api.collection(db,'bantamhub','team','messages'),{uid:auth.currentUser.uid,name:editing?'Organizer':member.name,body,createdAt:api.serverTimestamp()});$('chatText').value=''}catch{toast('Message could not be sent. Check your connection and team access.')}finally{chatSending=false;if($('sendChat'))$('sendChat').disabled=!chatLoaded||!!chatError}}}
function paintMessages(){if(view!=='chat'||!$('chatMessages'))return;const el=$('chatMessages'),nearBottom=el.scrollHeight-el.scrollTop-el.clientHeight<80;el.innerHTML=messages.length?messages.map(m=>'<article class="chatMessage"><div class="row"><b>'+esc(m.name)+'</b><span class="muted">'+esc(m.createdAt?.toDate?m.createdAt.toDate().toLocaleString():'Sending…')+'</span>'+(editing?'<button class="danger smallbtn" data-delete-message="'+esc(m.id)+'">Delete</button>':'')+'</div><p>'+esc(m.body)+'</p></article>').join(''):'<div class="empty">No messages yet. Start a conversation.</div>';if(nearBottom)el.scrollTop=el.scrollHeight;document.querySelectorAll('[data-delete-message]').forEach(b=>b.onclick=async()=>{if(!editing||!confirm('Delete this message for everyone?'))return;b.disabled=true;try{await api.deleteDoc(api.doc(db,'bantamhub','team','messages',b.dataset.deleteMessage));toast('Message deleted')}catch{b.disabled=false;toast('Could not delete the message. Check your connection and organizer access.')}});if($('chatStatus'))$('chatStatus').textContent=chatError||(!chatLoaded?'Loading chat…':'');if($('sendChat'))$('sendChat').disabled=chatSending||!chatLoaded||!!chatError}
function stopTeamStreams(){if(stopCloud)stopCloud();if(stopChat)stopChat();if(stopAccess)stopAccess();stopCloud=stopChat=stopAccess=null;messages=[];chatLoaded=false;chatError='';inviteCode='';accessError=''}
async function startTeamStreams(generation){if(generation!==authGeneration)return;stopTeamStreams();document.querySelectorAll('[data-view]').forEach(b=>b.disabled=false);if(editing){try{await api.runTransaction(db,async tx=>{const ref=api.doc(db,'bantamhub','team'),snap=await tx.get(ref);if(!snap.exists())tx.set(ref,blankState())})}catch{if(generation!==authGeneration)return;cloudError='Could not initialize the team. Check your organizer UID and Firestore rules.';ready=false;render();return}}if(generation!==authGeneration)return;stopCloud=api.onSnapshot(api.doc(db,'bantamhub','team'),snapshot=>{if(generation!==authGeneration)return;const data=snapshot.exists()?snapshot.data():blankState();if(!validState(data)){cloudError='Team data needs attention.';ready=false}else{team=data;ready=true;cloudError=''}render()},()=>{if(generation!==authGeneration)return;cloudError='Could not read the team. Check Firestore rules and your connection.';ready=false;render()});stopChat=api.onSnapshot(api.query(api.collection(db,'bantamhub','team','messages'),api.orderBy('createdAt','desc'),api.limit(100)),snapshot=>{if(generation!==authGeneration)return;messages=snapshot.docs.map(d=>({id:d.id,...d.data()})).reverse();chatLoaded=true;chatError='';paintMessages()},()=>{if(generation!==authGeneration)return;chatLoaded=true;chatError='Chat is unavailable. Check your connection and publish the updated Firestore rules.';paintMessages()});if(editing)stopAccess=api.onSnapshot(api.doc(db,'bantamhub','team','settings','access'),snap=>{if(generation!==authGeneration)return;inviteCode=snap.exists()?snap.data().code:'';accessError='';if(view==='settings')render()},()=>{if(generation!==authGeneration)return;accessError='Invite codes need the updated Firestore rules.';if(view==='settings')render()})}
async function initCloud(){const config=window.BANTAM_TEAM_CONFIG;if(!config)return render();cloud=true;ready=false;editing=false;storageError=false;team=blankState();render();try{if(!config.firebase?.apiKey||!config.organizerUid)throw Error('Missing Firebase configuration.');const [app,firestore,authentication]=await Promise.all([import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js'),import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js')]);api={...firestore,...authentication};const firebaseApp=app.initializeApp(config.firebase,'bantam-team-hub');db=api.getFirestore(firebaseApp);auth=api.getAuth(firebaseApp);await api.setPersistence(auth,api.browserLocalPersistence);api.onAuthStateChanged(auth,async user=>{const generation=++authGeneration;stopTeamStreams();if(stopMember)stopMember();stopMember=null;member=null;memberLoaded=false;ready=false;team=blankState();editing=!!user&&user.uid===config.organizerUid;signedOrganizer=!!user&&!user.isAnonymous;cloudError='';render();if(!user){try{await api.signInAnonymously(auth)}catch{cloudError='Enable Anonymous sign-in in your TeamHub Firebase project.';render()}return;}if(editing){memberLoaded=true;await startTeamStreams(generation);return;}stopMember=api.onSnapshot(api.doc(db,'bantamhub','team','members',user.uid),snap=>{if(generation!==authGeneration)return;const wasMember=!!member;member=snap.exists()?snap.data():null;memberLoaded=true;if(member){if(!wasMember)startTeamStreams(generation);}else{stopTeamStreams();ready=false;team=blankState();render()}},()=>{if(generation!==authGeneration)return;cloudError='Could not check membership. Publish the updated TeamHub Firestore rules.';memberLoaded=false;ready=false;render()})});}catch{cloudError='Could not connect to Firebase. Check the configuration and internet connection.';ready=false;editing=false;render()}}

initCloud();
